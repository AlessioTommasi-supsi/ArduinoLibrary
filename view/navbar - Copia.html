<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar con Effetto Onda</title>
  <style>
    /* Stile per il body */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #333;
      padding: 15px 0;
      width: 100%;
      position: fixed;
      top: 0;
      z-index: 2000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* Singoli link della navbar */
    .navbar a {
      text-decoration: none;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      transition: all 0.3s ease-in-out;
    }

    /* Icone emoji grandi */
    .navbar .icon {
      width: 100px; /* Dimensione raddoppiata rispetto a prima */
      height: 100px;
      margin-bottom: 5px;
      background-color: white;
      border-radius: 15px; /* Quadrati con angoli leggermente arrotondati */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px; /* Dimensione emoji maggiore */
      color: #333;
      transition: transform 0.2s ease, background-color 0.3s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
    }

    /* Effetto onda al passaggio del mouse */
    .navbar a:hover .icon {
      transform: scale(1.6); /* Molto più grande al passaggio del mouse */
      background-color: #4CAF50;
      color: white;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4); /* Ombra più pronunciata */
    }

    /* Effetto onda sulle icone vicine */
    .navbar a:hover ~ a .icon,
    .navbar a:hover .icon ~ .icon {
      transform: scale(1.3); /* Ingrandisce leggermente anche le vicine */
    }

    /* Testo descrittivo */
    .navbar span {
      font-size: 16px;
      color: white;
      opacity: 0.9;
      transition: color 0.3s ease;
    }

    .navbar a:hover span {
      color: #4CAF50;
    }

    /* Design responsivo per dispositivi più piccoli */
    @media (max-width: 768px) {
      .navbar .icon {
        width: 80px;
        height: 80px;
        font-size: 40px; /* Icone leggermente più piccole per schermi medi */
      }

      .navbar span {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .navbar .icon {
        width: 60px;
        height: 60px;
        font-size: 30px; /* Icone compatte per smartphone */
      }

      .navbar span {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar Responsive con Effetto Onda -->
  <div class="navbar">
    <a href="/monitor">
      <div class="icon">🖥️</div>
      <span>Monitor</span>
    </a>
    <a href="/pinout">
      <div class="icon">🔌</div>
      <span>Pinout</span>
    </a>
    <a href="/currentregister">
      <div class="icon">📋</div>
      <span>Register</span>
    </a>
    <a href="/history">
      <div class="icon">⏳</div>
      <span>History</span>
    </a>
    <a href="/graph">
      <div class="icon">📈</div>
      <span>Graph</span>
    </a>
    <a href="/config">
      <div class="icon">📶</div>
      <span>Config</span>
    </a>
  </div>

</body>
</html>
