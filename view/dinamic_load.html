<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caricamento Dinamico con Pulsante</title>
  <style>
    /* Stile per il body */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Usa "flex-start" per mostrare gli elementi dall'alto */
      min-height: 100vh;
      overflow: auto; /* Consente lo scrolling */
      padding: 20px;
    }

    /* Stile per il pulsante */
    #loadButton {
      margin: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    #loadButton:hover {
      background-color: #45a049;
    }

    /* Messaggio iniziale di caricamento */
    #loading {
      font-size: 20px;
      color: #555;
      text-align: center;
      display: none; /* Nascondi per l'uso dinamico */
    }

    /* Stile dei contenuti */
    #content_to_add {
      width: 100%;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <!-- Messaggio di caricamento -->
  <div id="loading">Caricamento in corso...</div>
  
  <!-- Div iniziale per il primo contenuto -->
  <div id="content_to_add"></div>
  
  <!-- Pulsante per aggiungere contenuto -->
  <button id="loadButton">Aggiungi Contenuto</button>

  <script>
    // Variabile globale per tenere traccia dell'indice dei contenuti aggiunti
    let contentIndex = 0;

    // Funzione per caricare il contenuto dinamicamente dal backend ESP32
    async function loadPageContent() {
      try {
        // Mostra il messaggio di caricamento
        document.getElementById('loading').style.display = 'block';

        // Effettua la richiesta GET al server ESP32
        const response = await fetch('http://192.168.178.144/pinoutContent');

        // Controlla se la risposta è valida
        if (!response.ok) {
          throw new Error('Errore durante il caricamento dei dati: ' + response.status);
        }

        // Recupera il contenuto testuale dalla risposta
        const content = await response.text();

        // Trova il div con id "content_to_add"
        const contentDiv = document.getElementById('content_to_add');

        // Aggiungi il contenuto al div corrente
        contentDiv.innerHTML = content;

        // Cambia l'ID del div corrente per assegnare un indice univoco
        contentDiv.id = `contentAdd_${contentIndex}`;
        contentIndex++;

        // Crea un nuovo div "content_to_add" sotto il contenuto appena aggiunto
        const newContentDiv = document.createElement('div');
        newContentDiv.id = 'content_to_add'; // Nuovo div con ID riutilizzabile
        newContentDiv.style.marginTop = '20px'; // Margine per separare i div
        document.body.appendChild(newContentDiv); // Aggiunge il nuovo div alla fine del body

        // Nasconde il messaggio di caricamento
        document.getElementById('loading').style.display = 'none';
      } catch (error) {
        // Gestisce gli errori e mostra un messaggio all'utente
        document.getElementById('loading').innerText = 'Errore durante il caricamento dei dati';
        console.error(error);
      }
    }

    // Carica il contenuto all'avvio della pagina
    window.onload = loadPageContent;

    // Associa la funzione al pulsante
    document.getElementById('loadButton').addEventListener('click', loadPageContent);
  </script>

</body>
</html>
