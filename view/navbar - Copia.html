<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar con Effetto Glass Grigio</title>
  <style>
    /* Stile per il body */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: flex-start;
      height: 100vh;
      overflow-x: hidden;
    }

    /* Navbar con effetto glass grigio */
    .navbar {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      background: rgba(48, 48, 48, 0.6); /* Grigio traslucido */
      backdrop-filter: blur(12px); /* Sfocatura per effetto glass */
      -webkit-backdrop-filter: blur(12px); /* Compatibilità Safari */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); /* Ombra per effetto 3D */
      border-radius: 15px; /* Angoli arrotondati */
      padding: 10px 20px; /* Spaziatura interna */
      position: fixed;
      top: 15px; /* Posizionato dall'alto */
      left: 50%; /* Centrato orizzontalmente */
      transform: translateX(-50%); /* Correzione per centratura */
      z-index: 2000;
      max-width: calc(100% - 30px); /* Limita la larghezza */
    }

    /* Singoli link della navbar */
    .navbar a {
      text-decoration: none;
      color: white;
      text-align: center;
      display: inline-flex;
      flex-direction: column; /* Testo sotto l'icona */
      align-items: center;
      justify-content: center;
      padding: 10px;
      transition: transform 0.2s ease-in-out, color 0.3s ease;
    }

    /* Icone emoji quadrate */
    .navbar .icon {
      width: 80px;
      height: 80px;
      background-color: rgba(255, 255, 255, 0.752); /* Fondo traslucido */
      border-radius: 8px; /* Angoli arrotondati */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px; /* Emoji grande */
      color: #333;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.2), 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* Testo descrittivo sotto */
    .navbar span {
      font-size: 16px; /* Dimensione testo */
      margin-top: 8px;
      color: white;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    /* Hover per icone e scritte */
    .navbar a:hover .icon {
      transform: scale(1.3); /* Ingrandisce l'icona */
      background-color: rgba(161, 255, 167, 0.7); /* Verde traslucido per hover */
      color: white;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
    }

    .navbar a:hover span {
      color: #4CAF50;
    }

    /* Responsive per tablet e desktop */
    @media (min-width: 900px) {
      .navbar {
        flex-direction: column; /* Navbar verticale */
        top: 50%; /* Centrato verticalmente */
        left: 15px; /* Posizionato a sinistra */
        transform: translateY(-50%); /* Correzione per centratura verticale */
        padding: 20px 10px; /* Aggiunta spaziatura verticale */
        height: auto;
      }

      .navbar a {
        margin-bottom: 15px;
      }

      .navbar span {
        font-size: 12px; /* Testo più piccolo per layout laterale */
      }
    }

    /* Responsive per smartphone */
    @media (max-width: 480px) {
      .navbar .icon {
        width: 60px;
        height: 60px;
        font-size: 30px;
      }

      .navbar span {
        font-size: 10px;
      }
    }
  </style>
</head>
