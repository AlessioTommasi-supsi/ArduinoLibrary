<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Personalizzata</title>
  <style>
    /* Stile per il body */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: center;
      background-color: #333;
      padding: 10px 0;
      width: 100%;
      position: fixed;
      top: 0;
      z-index: 2000;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Singoli link della navbar */
    .navbar a {
      text-decoration: none;
      color: white;
      text-align: center;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease-in-out;
    }

    /* Effetto hover */
    .navbar a:hover {
      color: #4CAF50;
      transform: translateY(-3px);
    }

    /* Icone simulate */
    .navbar .icon {
      width: 30px;
      height: 30px;
      margin-bottom: 5px;
      background-color: white;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #333;
      transition: background-color 0.3s ease;
    }

    /* Cambia il colore dell'icona al passaggio del mouse */
    .navbar a:hover .icon {
      background-color: #4CAF50;
      color: white;
    }

    /* Stile testo descrittivo */
    .navbar span {
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Navbar con icone simulate -->
  <div class="navbar">
    <a href="/monitor">
      <div class="icon">M</div>
      <span>Monitor</span>
    </a>
    <a href="/pinout">
      <div class="icon">P</div>
      <span>Pinout</span>
    </a>
    <a href="/currentregister">
      <div class="icon">R</div>
      <span>Register</span>
    </a>
    <a href="/history">
      <div class="icon">H</div>
      <span>History</span>
    </a>
    <a href="/graph">
      <div class="icon">G</div>
      <span>Graph</span>
    </a>
    <a href="/config">
      <div class="icon">C</div>
      <span>Config</span>
    </a>
  </div>

</body>
</html>
