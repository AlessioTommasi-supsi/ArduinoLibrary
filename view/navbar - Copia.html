<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pin-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            margin-bottom: 20px;
            width: 80%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pin-info {
            margin-bottom: 10px;
            font-weight: bold;
        }

        .pin-note {
            font-style: italic;
            color: #555;
        }

        .pin-actions form {
            display: inline-block;
            margin-right: 10px;
        }

        .pin-actions button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .pin-actions button.start {
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
        }

        .pin-actions button.stop {
            background-color: rgba(128, 128, 128, 0.7);
            color: white;
        }

        .pin-actions button.edit {
            background-color: rgba(0, 0, 255, 0.7);
            color: white;
        }
    </style>
</head>

<body>
    <div class="pin-container">
        <div class="pin-info">Pin number: 23, Type: SPI, Voltage: 0.000 V, Input: Yes, Note: VSPI MOSI or input digital
        </div>
        <div class="pin-actions">
            <form action="/startRecordingPin" method="get">
                <input type="hidden" name="pin" value="23">
                <label for="milliseconds">Milliseconds:</label>
                <input type="text" id="milliseconds" name="milliseconds" required value="1000">
                <button type="submit" class="start">Start Recording</button>
            </form>
            <form action="/stopRecordingPin" method="get">
                <input type="hidden" name="pin" value="23">
                <button type="submit" class="stop">Stop Recording</button>
            </form>
            <form action="/editPin" method="get">
                <input type="hidden" name="pin" value="23">
                <button type="submit" class="edit">Edit</button>
            </form>
        </div>
    </div>

    <!-- Ripeti per gli altri pin -->
    <div class="pin-container">
        <div class="pin-info">Pin number: 0, Type: ADC, Voltage: 3.300 V, Input: No, Note: ADC2 is in use by Wi-Fi.
            Please see <a
                href="https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-reference/peripherals/adc.html#adc-limitations"
                target="_blank">this link</a> for more info.</div>
        <div class="pin-actions">
            <form action="/startRecordingPin" method="get">
                <input type="hidden" name="pin" value="0">
                <label for="milliseconds">Milliseconds:</label>
                <input type="text" id="milliseconds" name="milliseconds" required value="1000">
                <button type="submit" class="start">Start Recording</button>
            </form>
            <form action="/stopRecordingPin" method="get">
                <input type="hidden" name="pin" value="0">
                <button type="submit" class="stop">Stop Recording</button>
            </form>
            <form action="/editPin" method="get">
                <input type="hidden" name="pin" value="0">
                <button type="submit" class="edit">Edit</button>
            </form>
        </div>
    </div>
    <!-- Aggiungi altri pin qui -->
</body>

</html>
