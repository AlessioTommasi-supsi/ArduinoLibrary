<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra di Progresso Circolare</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <style>

        .chart-container {
            font-family: 'Raleway', sans-serif;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
            padding: 20px;
        }

        .chart-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
            max-width: 300px;
            min-width: 150px;
            position: relative;
        }

        .chart {
            width: 100%;
            height: auto;
        }

        .label {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .percentage {
            font-size: 1rem;
            margin-top: 10px;
        }

        .center-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .chart-wrapper {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="chart-container">
        <div class="chart-wrapper">
            <div class="label">Heap</div>
            <canvas id="chart1" class="chart"></canvas>
            <div class="center-label" id="label1">75%</div>
            <div class="percentage">Utilizzato: 75 / Totale: 100</div>
        </div>
        <div class="chart-wrapper">
            <div class="label">Stack</div>
            <canvas id="chart2" class="chart"></canvas>
            <div class="center-label" id="label2">50%</div>
            <div class="percentage">Utilizzato: 50 / Totale: 100</div>
        </div>
        <div class="chart-wrapper">
            <div class="label">CPU</div>
            <canvas id="chart3" class="chart"></canvas>
            <div class="center-label" id="label3">25%</div>
            <div class="percentage">Utilizzato: 25 / Totale: 100</div>
        </div>
        <div class="chart-wrapper">
            <div class="label">Memory</div>
            <canvas id="chart4" class="chart"></canvas>
            <div class="center-label" id="label4">90%</div>
            <div class="percentage">Utilizzato: 90 / Totale: 100</div>
        </div>
    </div>

    <script>
        function createChart(ctx, percentage) {
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [percentage, 100 - percentage],
                        backgroundColor: ['#4caf50', '#ddd'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '80%',
                    plugins: {
                        tooltip: { enabled: false },
                        legend: { display: false }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            createChart(document.getElementById('chart1').getContext('2d'), 75);
            createChart(document.getElementById('chart2').getContext('2d'), 50);
            createChart(document.getElementById('chart3').getContext('2d'), 25);
            createChart(document.getElementById('chart4').getContext('2d'), 90);
        });
    </script>
</body>

</html>
