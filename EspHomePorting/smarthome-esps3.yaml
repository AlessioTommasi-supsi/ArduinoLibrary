esphome:
  name: panigalemel
  friendly_name: Panigale Mel ESP32-S3
  comment: "Complete ESPHome Porting of SmartHome C++ MVC Project for ESP32-S3"
  includes:
    - src/model/CustomButtonModel.h
    - src/model/CustomButtonModel.cpp
    - src/view/NavigationManager.h
    - src/view/NavigationManager.cpp
    - src/view/ImagesData.h
    - src/view/ImagesData.cpp
    - src/view/ViewConfig.h
    - src/view/ViewConfig.cpp
    - src/view/ViewServices.h
    - src/view/ViewServices.cpp
    - src/controller/CustomWebController.h
    - src/controller/CustomWebController.cpp
  on_boot:
    priority: -100.0
    then:
      - lambda: |-
          auto *custom_controller = new smarthome::CustomWebController();
          custom_controller->set_relays(relay_posizione, relay_anabbagliante);
          custom_controller->setup();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

mdns:
  disabled: false


# Enable logging
logger:
  level: INFO
  baud_rate: 115200

# Native Home Assistant API (Optional Encryption)
api:
  encryption:
    key: !secret api_encryption_key

# OTA Updates
ota:
  - platform: esphome

# Wi-Fi Configuration (Dual Mode: Wi-Fi Casa + AP SEMPRE ATTIVO "Panigale-Mel-AP")
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s

  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password
    ap_timeout: 0s

  on_connect:
    - lambda: |-
        if (smarthome::global_custom_web_controller != nullptr) {
          smarthome::global_custom_web_controller->enable_dual_mode_ap();
        }

# Native Captive Portal (DNS Server automatico su porta 53 + rilevamento OS)
captive_portal:

# Standalone Web Server (v3) with Glassmorphism CSS theme
web_server:
  port: 80
  version: 3
  css_include: "glassmorphism.css"
  sorting_groups:
    - id: group_relays
      name: "Controllo Luci"
      sorting_weight: 10
    - id: group_system
      name: "Diagnostica Sistema"
      sorting_weight: 20

# ==========================================
# RELAYS / SWITCHES (ESP32-S3 GPIO Mappings - 2 Canali Active-LOW)
# ==========================================
switch:
  - platform: gpio
    name: "Posizione"
    pin:
      number: GPIO4
      inverted: true
    id: relay_posizione
    icon: "mdi:car-parking-lights"
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "Anabbagliante"
    pin:
      number: GPIO5
      inverted: true
    id: relay_anabbagliante
    icon: "mdi:car-light-dimmed"
    restore_mode: RESTORE_DEFAULT_OFF

# ==========================================
# PULSANTI FISICI BISTABILI SPST (GPIO 7 e 6 verso GND) CON DEBOUNCE NATIVO
# ==========================================
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
    name: "Pulsante Fisico Posizione"
    id: button_sw1
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - switch.toggle: relay_posizione

  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    name: "Pulsante Fisico Anabbagliante"
    id: button_sw2
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      - switch.toggle: relay_anabbagliante

# ==========================================
# DIAGNOSTICS & SYSTEM SENSORS
# ==========================================
sensor:
  - platform: wifi_signal
    name: "Segnale Wi-Fi (RSSI)"
    update_interval: 10s

  - platform: uptime
    name: "Uptime Sistema"
    update_interval: 60s

# System Memory Monitoring (Heap)
debug:

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Indirizzo IP ESP32-S3"
    ssid:
      name: "Rete Wi-Fi Connessa"

  - platform: version
    name: "Versione ESPHome"

# Control Buttons
button:
  - platform: restart
    name: "Riavvia ESP32-S3"
