<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porfolio - Alessio Tommasi</title>
    <link rel="icon"
        href="https://raw.githubusercontent.com/AlessioTommasi-supsi/porfolio/main/html/view/images/logo.png"
        type="image/png">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/style.css">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/gear.css">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/logo.css">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/glass_effect.css">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/autoType.css">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/buttons.css">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/dashboard.css">
    <link rel="stylesheet" href="http://alessiotommasi.com/view/css/particle_style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pin-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            margin-bottom: 20px;
            width: 80%;
            max-width: 600px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pin-info {
            margin-bottom: 10px;
            font-weight: bold;
        }

        .pin-actions form {
            display: inline-block;
            margin-right: 10px;
        }

        .pin-actions button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .pin-actions button.start {
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
        }

        .pin-actions button.stop {
            background-color: rgba(128, 128, 128, 0.7);
            color: white;
        }

        .pin-actions button.edit {
            background-color: rgba(0, 0, 255, 0.7);
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: center;
            background-color: #333;
            width: 100%;
            padding: 10px 0;
            position: fixed;
            top: 0;
            z-index: 2000;
        }

        .navbar a {
            color: white;
            padding: 14px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        .form-container {
            width: 80%;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 60px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
        }

        input,
        select {
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .history-table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 18px;
            text-align: left;
        }

        .history-table th,
        .history-table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
        }

        .history-table th {
            background-color: #f2f2f2;
        }

        .history-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .history-table tr:nth-child(odd) {
            background-color: #fff;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="main_container_absolute">
        <div class="main_container_relative">
            <div id="particles-js"><canvas class="particles-js-canvas-el" width="1265" height="916"
                    style="width: 100%; height: 100%;"></canvas></div>
            <div class="navbar"><a href="/monitor">Monitor</a><a href="/pinout">Pinout</a><a
                    href="/currentregister">Current Register</a><a href="/history">History</a><a
                    href="/graph">Graph</a><a href="/config">Config</a></div><br><br><br><br><br><br>
            <div id="textTypingContainer">
                <div id="textTypingAnimation" class="glassEffect">I am: Engineer|</div>
            </div>

            <div>
                <div class="no_overflow">

                    <div class="logo_container">
                        <div class="gear_logo_container">
                            <img class="gear"
                                src="https://raw.githubusercontent.com/AlessioTommasi-supsi/porfolio/main/html/view/images/gearNobg.png"
                                alt="Immagine senza sfondo">
                        </div>
                        <div class="logo">
                            <img class="logo_image"
                                src="https://raw.githubusercontent.com/AlessioTommasi-supsi/porfolio/main/html/view/images/logo.png"
                                alt="Immagine senza sfondo">
                        </div>
                    </div>

                    <div class="gear_container_left"
                        style="transform: translate(-50%, -50%) rotate(0deg); width: auto; height: 100%; position: fixed; left: 0%; top: 50%; z-index: 500;">
                        <img class="gear"
                            src="https://raw.githubusercontent.com/AlessioTommasi-supsi/porfolio/main/html/view/images/gearNobg.png"
                            alt="Immagine senza sfondo">
                    </div>

                    <div class="gear_container_bottom"
                        style="transform: translate(-50%, -50%) rotate(0deg); width: auto; height: 100%; bottom: -100%; position: fixed; left: 700px; z-index: 500;">
                        <img class="gear"
                            src="https://raw.githubusercontent.com/AlessioTommasi-supsi/porfolio/main/html/view/images/gearNobg.png"
                            alt="Immagine senza sfondo">
                    </div>
                </div>
                
                
                <div class="next_page" id="aboutMeTitle">
                    <div class="glass_container">
                        <div class="glass_content">
                                
                                    
                                    
                            <button >C++</button>
                            <button >ESP32</button>
                            <button >MODBUS</button>
                            <button>CSS</button>
                            
                           
                        
                                
                        </div>
                    </div>

                    

                <!--  JavaScript files -->
                <script src="http://alessiotommasi.com/view/js/rotation_on_scroll.js"></script>
                <script src="http://alessiotommasi.com/view/js/autoType.js"></script>
                <script src="http://alessiotommasi.com/view/js/scrollUp.js"></script>
                <script src="http://alessiotommasi.com/view/js/class_switcher.js"></script>

                <script src="http://alessiotommasi.com/view/js/particleLib/particles.js"></script>
                <script src="http://alessiotommasi.com/view/js/particleLib/app.js"></script>

            </div>
        </div>
    </div>
</body>

</html>
