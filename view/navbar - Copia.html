<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar con Scritte Responsive e Hover</title>
  <style>
    /* Stile per il body */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-evenly; /* Spaziatura uniforme */
      align-items: center;
      background-color: #333;
      padding: 15px 0;
      width: 100%;
      position: fixed;
      top: 0;
      z-index: 2000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* Singoli link della navbar */
    .navbar a {
      text-decoration: none;
      color: white;
      text-align: center;
      display: inline-flex;
      flex-direction: column; /* Testo sotto l'icona */
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease-in-out;
    }

    /* Icone emoji quadrate */
    .navbar .icon {
      width: 100px; /* Dimensione iniziale */
      height: 100px;
      background-color: white;
      border-radius: 8px; /* Angoli arrotondati */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px; /* Emoji più grande */
      color: #333;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    /* Testo descrittivo sotto */
    .navbar span {
      font-size: 16px; /* Dimensione iniziale del testo */
      margin-top: 8px;
      color: white;
      opacity: 0.9;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    /* Hover per icona e scritte */
    .navbar a:hover .icon {
      transform: scale(1.5); /* Ingrandisce l'icona */
      background-color: #4CAF50;
      color: white;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    }

    .navbar a:hover span {
      transform: scale(1.3); /* Testo ingrandito */
      color: #4CAF50;
    }

    /* Ridimensionamento responsive */
    @media (max-width: 1024px) {
      .navbar .icon {
        width: 80px;
        height: 80px;
        font-size: 40px;
      }

      .navbar span {
        font-size: 14px;
      }
    }

    @media (max-width: 768px) {
      .navbar .icon {
        width: 70px;
        height: 70px;
        font-size: 35px;
      }

      .navbar span {
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      .navbar .icon {
        width: 60px;
        height: 60px;
        font-size: 30px;
      }

      .navbar span {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar Responsive con Hover Sincronizzato -->
  <div class="navbar">
    <a href="/monitor">
      <div class="icon">🖥️</div>
      <span>Monitor</span>
    </a>
    <a href="/pinout">
      <div class="icon">🔌</div>
      <span>Pinout</span>
    </a>
    <a href="/currentregister">
      <div class="icon">📋</div>
      <span>Register</span>
    </a>
    <a href="/history">
      <div class="icon">⏳</div>
      <span>History</span>
    </a>
    <a href="/graph">
      <div class="icon">📈</div>
      <span>Graph</span>
    </a>
    <a href="/config">
      <div class="icon">📶</div>
      <span>Config</span>
    </a>
  </div>

</body>
</html>
